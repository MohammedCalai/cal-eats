name: Developer checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:developer

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --tag cal-eats:ci .
      - name: Verify runtime recovery tools without starting the API
        run: |
          docker run --rm --entrypoint node cal-eats:ci --check scripts/backup.js
          docker run --rm --entrypoint node cal-eats:ci --check scripts/restore-check.js
          docker run --rm --entrypoint node cal-eats:ci --check scripts/database-check.js
          docker run --rm --entrypoint node cal-eats:ci --input-type=module -e 'import assert from "node:assert/strict"; import {DEFAULT_SOURCE,BACKUP_ROOT} from "./scripts/backup.js"; assert.equal(DEFAULT_SOURCE,"/data/calai-eats.sqlite"); assert.equal(BACKUP_ROOT,"/data/backups");'
      - name: Verify Windows printer setup from the deployed image
        run: |
          docker run --rm --entrypoint node cal-eats:ci --input-type=module -e 'import assert from "node:assert/strict"; import {buildPrinterBridgePackage} from "./apps/api/src/printer-bridge-package.js"; const printer={id:"b2222222-2222-4222-8222-222222222222",restaurant_id:"a1111111-1111-4111-8111-111111111111",name:"Container setup check",ip_address:"192.0.2.24"}; const setup={schemaVersion:1,product:"cal-eats",printerId:printer.id,restaurantId:printer.restaurant_id,code:"container-check-only",expiresAt:"2030-01-01T00:00:00Z"}; const zip=await buildPrinterBridgePackage(printer,"https://eats.calai.info",{setup}); assert.equal(zip.readUInt32LE(0),0x04034b50); for(const name of ["calai-native/shared-prefix.txt","calai-native/shared-suffix.txt","calai-native/supported-hashes.json","windows/connect-shared-calai.ps1"])assert.ok(!zip.includes(Buffer.from(name)),name);'
      - name: Verify isolated tablet installer and API imports from the runtime image
        run: |
          docker run --rm --entrypoint node cal-eats:ci --input-type=module -e 'import assert from "node:assert/strict"; import {buildTerminalInstaller} from "./apps/terminal-auth/windows/build-installer.mjs"; const script=buildTerminalInstaller(); assert.ok(script.includes("CalEatsTerminalAuth")); assert.ok(script.includes("CalEats - Terminal Auth Broker")); assert.ok(!script.includes("New-ItemProperty")); assert.ok(!script.includes("__PAYLOAD_BASE64__")); await import("./apps/api/src/app.js");'
