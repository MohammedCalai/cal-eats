name: Developer checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:developer

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --tag cal-eats:ci .
      - name: Verify runtime recovery tools without starting the API
        run: |
          docker run --rm --entrypoint node cal-eats:ci --check scripts/backup.js
          docker run --rm --entrypoint node cal-eats:ci --check scripts/restore-check.js
          docker run --rm --entrypoint node cal-eats:ci --check scripts/database-check.js
          docker run --rm --entrypoint node cal-eats:ci --input-type=module -e 'import assert from "node:assert/strict"; import {DEFAULT_SOURCE,BACKUP_ROOT} from "./scripts/backup.js"; assert.equal(DEFAULT_SOURCE,"/data/calai-eats.sqlite"); assert.equal(BACKUP_ROOT,"/data/backups");'
