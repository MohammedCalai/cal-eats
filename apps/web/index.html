<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eaf5ff">
  <meta name="description" content="Cal-Eats local and hosted browser preview for Luton.">
  <title>Cal-Eats — Luton local demo</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/calai-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/calai-theme.css">
  <link rel="stylesheet" href="/customer-panels.css">
  <link rel="stylesheet" href="/location-ui.css">
  <link rel="stylesheet" href="/customer-light.css">
  <link rel="stylesheet" href="/customer-messages.css">
  <link rel="stylesheet" href="/customer-order-list.css">
</head>
<body class="customer-app">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <button class="brand" type="button" data-action="home" aria-label="Cal-Eats home"><span class="brand-motion" aria-hidden="true"><span class="brand-layer brand-prefix"><img class="brand-mark-image" src="/assets/cal-eats-logo.png" alt=""></span><span class="brand-layer brand-suffix"><img class="brand-mark-image" src="/assets/cal-eats-logo.png" alt=""></span></span></button>
    <div id="account"></div>
  </header>
  <div id="runtime-banner" class="runtime-banner" role="status" hidden></div>
  <div id="network" class="network" role="status" hidden>You appear to be offline. We’ll keep your order details on screen.</div>
  <main id="main" tabindex="-1"></main>
  <nav id="customer-bottom" class="bottom-nav" aria-label="Customer navigation" hidden>
    <button data-view="discover"><span aria-hidden="true">⌂</span>Browse</button>
    <button data-view="orders"><span aria-hidden="true">▤</span>Orders</button>
    <button data-view="offers"><span aria-hidden="true">◇</span>Offers</button>
    <button data-view="messages"><span aria-hidden="true">▱</span>Messages</button>
    <button data-view="account"><span aria-hidden="true">◯</span>Account</button>
  </nav>
  <aside id="notification-prompt" class="customer-notification-prompt" aria-label="Notification reminder" hidden></aside>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <footer><span>Cal-Eats local browser preview · Luton launch workspace</span> · <a href="/">About Cal-Eats</a></footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
