# Manual only. Uses a simulator build already reviewed by the release owner.
# This is a custom macOS job, not the paid Maestro/Simulators service.
# Check the account's free CI allowance immediately before starting a run.
# May run from a clean local source archive without granting GitHub access.
name: Genuine iPhone store screenshots
on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
      expected_source_sha:
        type: string
        required: true
      capture_workflow_sha:
        type: string
        required: true
      restaurant_name:
        type: string
        default: Arndale Market Curry Centre
      dish_name:
        type: string
        default: Chips
jobs:
  resolve_build:
    name: Resolve the approved simulator binary
    type: get-build
    params:
      platform: ios
      profile: simulator
      app_identifier: uk.co.calai.caleats
      git_commit_hash: ${{ inputs.expected_source_sha }}
      simulator: true
      wait_for_in_progress: false
  capture:
    name: Capture the current native customer app
    needs: [resolve_build]
    runs_on: macos-medium
    image: macos-tahoe-26.5-xcode-26.6
    env:
      SCREENSHOT_BUILD_ID: ${{ inputs.build_id }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      CAPTURE_WORKFLOW_SHA: ${{ inputs.capture_workflow_sha }}
      VERIFIED_ACCOUNT: ${{ account.name }}
      VERIFIED_PROJECT_ID: ${{ app.id }}
      VERIFIED_PROJECT_SLUG: ${{ app.slug }}
      VERIFIED_BUILD_ID: ${{ needs.resolve_build.outputs.build_id }}
      VERIFIED_BINARY_SOURCE: ${{ needs.resolve_build.outputs.git_commit_hash }}
      VERIFIED_PROFILE: ${{ needs.resolve_build.outputs.profile }}
      VERIFIED_SIMULATOR: ${{ needs.resolve_build.outputs.simulator }}
      VERIFIED_PLATFORM: ${{ needs.resolve_build.outputs.platform }}
      VERIFIED_APP_IDENTIFIER: ${{ needs.resolve_build.outputs.app_identifier }}
      RESTAURANT_NAME: ${{ inputs.restaurant_name }}
      DISH_NAME: ${{ inputs.dish_name }}
    steps:
      - uses: eas/checkout
      - name: Verify the approved binary and capture inputs
        run: |
          node <<'NODE'
          if (!/^[a-f0-9-]{36}$/i.test(process.env.SCREENSHOT_BUILD_ID || '')) throw new Error('A simulator build ID is required.');
          if (!/^[a-f0-9]{40}$/i.test(process.env.EXPECTED_SOURCE_SHA || '')) throw new Error('The full approved source SHA is required.');
          if (!/^[a-f0-9]{40}$/i.test(process.env.CAPTURE_WORKFLOW_SHA || '')) throw new Error('The separate capture workflow SHA is required.');
          if(process.env.VERIFIED_ACCOUNT!=='yankee1707'||process.env.VERIFIED_PROJECT_ID!=='5bf59184-c670-44f4-be78-5229cbd02300'||process.env.VERIFIED_PROJECT_SLUG!=='cal-eats')throw new Error('The workflow is not running in the approved Cal-Eats project.');
          if(process.env.VERIFIED_BUILD_ID!==process.env.SCREENSHOT_BUILD_ID||process.env.VERIFIED_BINARY_SOURCE!==process.env.EXPECTED_SOURCE_SHA)throw new Error('The server-resolved simulator build differs from the approved binary.');
          if(process.env.VERIFIED_PROFILE!=='simulator'||process.env.VERIFIED_SIMULATOR!=='true'||(process.env.VERIFIED_PLATFORM||'').toLowerCase()!=='ios'||process.env.VERIFIED_APP_IDENTIFIER!=='uk.co.calai.caleats')throw new Error('The resolved build is not the approved customer iOS Simulator binary.');
          for (const key of ['RESTAURANT_NAME','DISH_NAME']) if (!(process.env[key] || '').trim() || process.env[key].length > 150) throw new Error('Invalid capture selector.');
          console.log('Approved binary source and separate capture-workflow revision recorded. Anonymous native screenshots only.');
          NODE
      - name: Prepare the absolute artifact directory
        id: capture_artifacts
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const {execFileSync}=require('node:child_process');
          const out=path.resolve(process.cwd(),'store-screenshots');
          fs.mkdirSync(out,{recursive:true});
          fs.writeFileSync(path.join(out,'capture-attempt.json'),JSON.stringify({binarySourceCommit:process.env.VERIFIED_BINARY_SOURCE,captureWorkflowCommit:process.env.CAPTURE_WORKFLOW_SHA,simulatorBuildId:process.env.VERIFIED_BUILD_ID,startedAt:new Date().toISOString(),completed:false},null,2));
          execFileSync('set-output',['artifact_dir',out],{stdio:'inherit'});
          execFileSync('set-env',['SCREENSHOT_ARTIFACT_DIR',out],{stdio:'inherit'});
          NODE
      - uses: eas/download_build
        id: app
        with:
          build_id: ${{ inputs.build_id }}
          extensions: [app]
      - name: Pass the downloaded app path to subsequent steps
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const {execFileSync}=require('node:child_process');
          const appPath=${{ toJSON(steps.app.outputs.artifact_path) }};
          if(typeof appPath!=='string'||!path.isAbsolute(appPath)||!appPath.endsWith('.app')||!fs.existsSync(appPath))throw new Error('The downloaded simulator .app is missing.');
          execFileSync('set-env',['SCREENSHOT_APP_PATH',appPath],{stdio:'inherit'});
          NODE
      - name: Boot an iPhone, capture real screens and verify image sizes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {spawnSync} = require('node:child_process');
          const cwd = process.cwd();
          const mobile = fs.existsSync(path.join(cwd,'.maestro/store-screenshots.yml')) ? cwd : path.join(cwd,'apps/mobile');
          const out = process.env.SCREENSHOT_ARTIFACT_DIR;
          if(!out||!path.isAbsolute(out)||!fs.existsSync(out))throw new Error('The prepared artifact directory is missing.');
          const start=Date.now();
          let udid;
          function run(command,args,timeout=30000,inherit=false) {
            const budget=600000-(Date.now()-start);
            if(budget<=0)throw new Error('The ten-minute capture budget has expired.');
            const r=spawnSync(command,args,{encoding:'utf8',timeout:Math.min(timeout,budget),cwd:mobile,stdio:inherit?'inherit':'pipe'});
            if(r.error)throw r.error;
            if(r.status!==0)throw new Error(`${path.basename(command)} failed (${r.status}). ${inherit?'':(r.stderr||'').slice(-1200)}`);
            return r.stdout||'';
          }
          try {
            const available=Object.values(JSON.parse(run('xcrun',['simctl','list','devices','available','--json'])).devices).flat();
            const names=['iPhone 16 Pro','iPhone 17 Pro','iPhone 16','iPhone 15 Pro','iPhone 15','iPhone 14 Pro'];
            const device=names.map(name=>available.find(d=>d.name===name)).find(Boolean);
            if(!device)throw new Error('No supported Dynamic Island medium-display iPhone is installed.');
            udid=device.udid;
            if(device.state!=='Booted')run('xcrun',['simctl','boot',udid]);
            run('xcrun',['simctl','bootstatus',udid,'-b'],150000);
            run('xcrun',['simctl','ui',udid,'appearance','light']);
            run('xcrun',['simctl','status_bar',udid,'override','--time','9:41','--batteryState','charged','--batteryLevel','100']);
            const appPath=process.env.SCREENSHOT_APP_PATH;
            if(!appPath||!fs.existsSync(appPath)||!appPath.endsWith('.app'))throw new Error('A genuine iOS Simulator .app is required.');
            const identifier=run('/usr/libexec/PlistBuddy',['-c','Print CFBundleIdentifier',path.join(appPath,'Info.plist')]).trim();
            if(identifier!=='uk.co.calai.caleats')throw new Error('The supplied build is not the Cal-Eats customer app.');
            run('xcrun',['simctl','install',udid,appPath],60000);
            const maestro=fs.existsSync(path.join(process.env.HOME,'.maestro/bin/maestro'))?path.join(process.env.HOME,'.maestro/bin/maestro'):'maestro';
            run(maestro,['--udid',udid,'test','--format','junit','--output',path.join(out,'report.xml'),'--test-output-dir',out,'-e',`RESTAURANT_NAME=${process.env.RESTAURANT_NAME}`,'-e',`DISH_NAME=${process.env.DISH_NAME}`,'.maestro/store-screenshots.yml'],420000,true);
            function findPngs(dir){return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?findPngs(path.join(dir,e.name)):e.name.endsWith('.png')?[path.join(dir,e.name)]:[]);}
            const images=findPngs(out).filter(file=>/0[1-3]-(browse|restaurant|menu)\.png$/.test(file));
            if(images.length!==3)throw new Error('The complete three-screen capture was not produced.');
            const dimensions=images.map(file=>{
              const info=run('sips',['-g','pixelWidth','-g','pixelHeight','-g','hasAlpha',file]);
              const width=Number(info.match(/pixelWidth: (\d+)/)?.[1]),height=Number(info.match(/pixelHeight: (\d+)/)?.[1]);
              if(![[1179,2556],[1206,2622]].some(([w,h])=>w===width&&h===height))throw new Error('Unexpected App Store screenshot dimensions.');
              if(/hasAlpha: yes/.test(info))throw new Error('App Store screenshots must have no alpha channel.');
              return {file:path.relative(out,file),width,height};
            });
            fs.writeFileSync(path.join(out,'capture-manifest.json'),JSON.stringify({createdAt:new Date().toISOString(),binarySourceCommit:process.env.VERIFIED_BINARY_SOURCE,captureWorkflowCommit:process.env.CAPTURE_WORKFLOW_SHA,captureWorkflowSource:'Clean local checkout archive; revision verified by the dispatching release owner',simulatorBuildId:process.env.VERIFIED_BUILD_ID,expoAccount:process.env.VERIFIED_ACCOUNT,expoProjectId:process.env.VERIFIED_PROJECT_ID,profile:process.env.VERIFIED_PROFILE,device:device.name,bundleIdentifier:identifier,anonymous:true,retouched:false,images:dimensions},null,2));
            fs.writeFileSync(path.join(out,'capture-attempt.json'),JSON.stringify({binarySourceCommit:process.env.VERIFIED_BINARY_SOURCE,captureWorkflowCommit:process.env.CAPTURE_WORKFLOW_SHA,simulatorBuildId:process.env.VERIFIED_BUILD_ID,completedAt:new Date().toISOString(),completed:true},null,2));
          } catch(error) {
            fs.writeFileSync(path.join(out,'capture-failure.json'),JSON.stringify({failedAt:new Date().toISOString(),message:error.message},null,2));
            throw error;
          } finally {
            if(udid)spawnSync('xcrun',['simctl','shutdown',udid],{timeout:15000,stdio:'ignore'});
          }
          NODE
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: Genuine iPhone screenshots and provenance
          path: ${{ steps.capture_artifacts.outputs.artifact_dir }}
