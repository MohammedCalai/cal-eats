# Real native screens, anonymous browsing only. Never submits an order or signs in.
# Capture the settled Browse screen without any navigation or keyboard actions.
appId: uk.co.calai.caleats
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Search food, restaurants or cuisines
    timeout: 60000
- extendedWaitUntil:
    visible: ${RESTAURANT_NAME},.*
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 01-browse
