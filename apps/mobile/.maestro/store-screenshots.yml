# Real native screens, anonymous browsing only. Never submits an order or signs in.
# The current Simulator/XCTest driver reports a +60pt text-target Y offset.
# These two points are grounded in the preserved 1206x2622 native captures;
# selection/focus assertions verify the resulting UI instead of assuming success.
appId: uk.co.calai.caleats
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Search food, restaurants or cuisines
    timeout: 60000
- takeScreenshot: 00-before-coordinate-taps
- tapOn:
    point: 84.5%,17.4%
- takeScreenshot: 00-after-collection-tap
- assertVisible:
    text: Collection
    selected: true
- assertNotVisible:
    text: Search food, restaurants or cuisines
    focused: true
- extendedWaitUntil:
    visible: .*Collect from the restaurant
    timeout: 10000
- extendedWaitUntil:
    visible: ${RESTAURANT_NAME},.*
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-browse
- tapOn:
    point: 25%,60%
- takeScreenshot: 00-after-restaurant-tap
- extendedWaitUntil:
    visible: Back to restaurants
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-restaurant
- scrollUntilVisible:
    element:
      text: View ${DISH_NAME},.*
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-menu
