# Real native screens, anonymous browsing only. Never submits an order or signs in.
appId: uk.co.calai.caleats
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Search food, restaurants or cuisines
    timeout: 60000
- tapOn:
    text: Collection
    index: 0
- extendedWaitUntil:
    visible: ${RESTAURANT_NAME},.*
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-browse
- tapOn:
    text: ${RESTAURANT_NAME},.*
    index: 0
- extendedWaitUntil:
    visible: Restaurant information & allergens
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-restaurant
- scrollUntilVisible:
    element:
      text: View ${DISH_NAME},.*
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-menu
- tapOn:
    text: View ${DISH_NAME},.*
- extendedWaitUntil:
    visible: Close item details
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-item-details
- tapOn:
    text: Close item details
    index: 0
- tapOn: Add one ${DISH_NAME}
- tapOn: Open basket, 1 item
- extendedWaitUntil:
    visible: Your basket
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-basket
